name: LynxShell
options:
  bundleIdPrefix: com.huangbaoche.client
  deploymentTarget:
    iOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    IPHONEOS_DEPLOYMENT_TARGET: '14.0'
targets:
  LynxShell:
    type: application
    platform: iOS
    deploymentTarget: '14.0'
    sources:
      # App Target 只编译 Sample 宿主；Lynx 实现由 Podfile 中的 LynxShellKit 提供。
      - path: LynxShellSample
        excludes:
          - Resources/Bundles
          - Supporting/Info.plist
          - Supporting/Info-Debug.plist
      - path: LynxShellSample/Resources/Bundles
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangbaoche.client.store
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: J6SYSM2AHQ
        TARGETED_DEVICE_FAMILY: '1'
        CURRENT_PROJECT_VERSION: '1'
        MARKETING_VERSION: '1.0.0'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # XElement Behavior/AutoRegistry 位于 Objective-C 静态 Framework 中。
        OTHER_LDFLAGS:
          - $(inherited)
          - -ObjC
      configs:
        Debug:
          INFOPLIST_FILE: LynxShellSample/Supporting/Info-Debug.plist
        Release:
          INFOPLIST_FILE: LynxShellSample/Supporting/Info.plist
  LynxShellUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '14.0'
    sources:
      - path: Tests/UITests
    dependencies:
      - target: LynxShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangbaoche.client.store.uitests
        TARGETED_DEVICE_FAMILY: '1'
        TEST_TARGET_NAME: LynxShell
        GENERATE_INFOPLIST_FILE: YES
